<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .paper { fill: #F4F1EA; }
    .ink { fill: #171717; stroke: #171717; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #12110F; }
      .ink { fill: #EDE8DE; stroke: #EDE8DE; }
    }
  </style>
  <rect class="paper" width="32" height="32" />
  <rect class="ink" x="1" y="1" width="30" height="30" fill="none" stroke-width="2" />
  <rect class="ink" x="7" y="8" width="18" height="2" stroke="none" />
  <rect class="ink" x="7" y="14" width="18" height="2" stroke="none" />
  <rect class="ink" x="7" y="20" width="12" height="2" stroke="none" />
  <rect x="7" y="24" width="18" height="2" fill="#C43E1C" />
</svg>
